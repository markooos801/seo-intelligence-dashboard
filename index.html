    <script>
      // Fix for environments where window.fetch has only a getter (preventing "Cannot set property fetch of #<Window> which has only a getter")
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          
          function patchObj(obj) {
            if (!obj) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(obj, 'fetch');
              if (!desc || !desc.set || !desc.writable) {
                Object.defineProperty(obj, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          }

          patchObj(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchObj(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            patchObj(globalThis);
          }
        } catch (_) {}

        // Global error handler to suppress and handle getter-only fetch errors gracefully
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('fetch of #<Window>') !== -1 || (e.message.indexOf('fetch') !== -1 && e.message.indexOf('only a getter') !== -1))) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
